<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Queue</title>
<style>
  :root {
    --bg: #000000;
    --panel: #0a0a0a;
    --panel-2: #171717;
    --border: #3d3d3d;
    --border-strong: #ffffff;
    --text: #ffffff;
    --text-muted: #cfcfcf;
    --text-dim: #8a8a8a;
    --blue: #7ad4ef;
    --accent: #7ad4ef;
    --amber: #ffcf5c;
    --green: #5be3a4;
    --red: #ff8383;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 22px;
    font-size: 16px;
    line-height: 1.45;
  }
  .mono { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .wrap { max-width: 680px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .chip-logo { width: 40px; height: 40px; border: 2.5px solid var(--text); border-radius: 7px; position: relative; flex-shrink: 0; }
  .chip-logo::before, .chip-logo::after { content: ''; position: absolute; background: var(--text); width: 11px; height: 2.5px; top: 10px; }
  .chip-logo::before { left: -7px; box-shadow: 0 19px 0 var(--text); }
  .chip-logo::after { right: -7px; box-shadow: 0 19px 0 var(--text); }
  h1 { font-size: 28px; margin: 0; font-weight: 700; }
  .sub { color: var(--text-muted); font-size: 14px; margin-top: 3px; }
  .panel { background: var(--panel); border: 1.5px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 18px; }
  p.lead { color: var(--text-muted); font-size: 16px; line-height: 1.55; }
  label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 7px; margin-top: 18px; font-weight: 600; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=tel] {
    width: 100%; background: var(--panel-2); border: 1.5px solid var(--border); color: var(--text);
    padding: 14px 16px; border-radius: 9px; font-size: 17px; font-family: inherit;
  }
  input:focus, textarea:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  textarea {
    width: 100%; background: var(--panel-2); border: 1.5px solid var(--border); color: var(--text);
    padding: 14px 16px; border-radius: 9px; font-size: 17px; resize: vertical; min-height: 80px;
    font-family: inherit;
  }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 10px; font-weight: 700; font-size: 16px; }
  .btn-primary { width: 100%; margin-top: 22px; padding: 16px; background: var(--text); color: #000000; font-size: 17px; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-outline { padding: 12px 18px; background: transparent; border: 2px solid var(--text); color: var(--text); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .accent-row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  input[type=color] { width: 52px; height: 44px; padding: 2px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--panel-2); cursor: pointer; flex-shrink: 0; }
  #accentHexInput { max-width: 130px; }
  .accent-hint { font-weight: 400; color: var(--text-dim); font-size: 12.5px; }
  .btn-outline.small { padding: 8px 12px; font-size: 13.5px; }
  .btn-danger { padding: 12px 18px; background: transparent; border: 2px solid var(--red); color: var(--red); }
  .btn-danger.small { padding: 8px 12px; font-size: 13.5px; }
  .btn-green { padding: 12px 18px; background: var(--green); color: #000000; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  .code-display { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
  .code-box { flex: 1; min-width: 140px; background: var(--panel-2); border: 1.5px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
  .code-box .label { font-size: 12.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
  .code-box .value { font-size: 30px; font-weight: 700; color: var(--text); margin-top: 5px; letter-spacing: 0.05em; }
  .link-row { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
  .link-row input { flex: 1; }
  .status-pill { display: inline-block; padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; border: 1.5px solid transparent; }
  .status-pill.active { color: var(--green); border-color: var(--green); }
  .status-pill.closed { color: var(--red); border-color: var(--red); }
  .status-pill.expired { color: var(--text-muted); border-color: var(--border); }
  .board-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .board-count { font-size: 14.5px; color: var(--text-muted); font-weight: 700; }
  .empty-state { text-align: center; padding: 44px 20px; color: var(--text-muted); font-size: 16px; }
  .ticket { display: flex; align-items: center; gap: 16px; background: var(--panel-2); border: 1.5px solid var(--border); border-radius: 11px; padding: 14px 16px; margin-bottom: 12px; flex-wrap: wrap; }
  .ticket.next { border-color: var(--amber); border-width: 2px; }
  .ticket.helped { opacity: 0.6; border-style: dashed; }
  .ticket.helped .ticket-name, .ticket.helped .note-text { color: var(--text-dim); }
  .pin-badge { width: 38px; height: 38px; border-radius: 8px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; color: var(--text-muted); }
  .ticket.next .pin-badge { border-color: var(--amber); color: var(--amber); }
  .ticket-body { flex: 1; min-width: 160px; }
  .ticket-name { font-weight: 700; font-size: 17.5px; }
  .ticket-meta { font-size: 13.5px; color: var(--text-muted); margin-top: 3px; font-weight: 600; }
  .note-text { font-size: 15px; color: var(--text); margin-top: 5px; }
  .ticket-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .reorder-btns { display: flex; flex-direction: column; gap: 4px; }
  .icon-btn { width: 30px; height: 26px; background: transparent; border: 1.5px solid var(--border); color: var(--text); border-radius: 6px; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .icon-btn:disabled { opacity: 0.25; cursor: not-allowed; }
  .icon-btn:not(:disabled):hover { border-color: var(--blue); color: var(--blue); }
  .helped-btn { background: var(--green); color: #000000; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 700; font-size: 13.5px; flex-shrink: 0; cursor: pointer; }
  .banner { padding: 16px; border-radius: 10px; font-size: 15px; margin-bottom: 18px; border: 1.5px solid transparent; font-weight: 600; }
  .banner.info { background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: var(--accent); color: var(--accent); }
  .banner.warn { background: rgba(255,131,131,0.1); border-color: var(--red); color: var(--red); }
  .manage-link { display: inline-block; margin-top: 10px; color: var(--text-muted); font-size: 14px; cursor: pointer; text-decoration: underline; font-weight: 600; }
  .footer-note { text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 22px; }
  .footer-note a { color: var(--text-muted); }
  .pin-inputs { display: flex; gap: 10px; margin-top: 10px; }
  .pin-inputs input { text-align: center; font-size: 22px; padding: 14px; }
  .divider { height: 1px; background: var(--border); margin: 20px 0; border: none; }
  @media (max-width: 480px) {
    body { padding: 14px; font-size: 15px; }
    h1 { font-size: 23px; }
    .code-box .value { font-size: 24px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Firebase SDKs (static hosting compatible, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const ROOM_TTL_MS = 24 * 60 * 60 * 1000; // 24 hours
const ROOM_CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no 0/O or 1/I
function generateRoomCode(len = 5) {
  let code = '';
  for (let i = 0; i < len; i++) code += ROOM_CODE_CHARS[Math.floor(Math.random() * ROOM_CODE_CHARS.length)];
  return code;
}
function generatePin() { return String(Math.floor(1000 + Math.random() * 9000)); }
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}
function csvEscape(val) {
  const s = String(val == null ? '' : val);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function roomLink(code) {
  const url = new URL(window.location.href);
  url.search = '?room=' + code;
  url.hash = '';
  return url.toString();
}
const DEFAULT_ACCENT = '#7ad4ef';
const HEX_RE = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;

function getCookie(name) {
  const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return match ? decodeURIComponent(match.pop()) : null;
}
function setCookie(name, value, days) {
  const expires = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toUTCString();
  document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/; SameSite=Lax';
}
function applyAccent(hex) {
  document.documentElement.style.setProperty('--accent', hex);
}

function hoursMinsLeft(expiresDate) {
  const ms = expiresDate.getTime() - Date.now();
  if (ms <= 0) return 'expired';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  return h + 'h ' + m + 'm left';
}

const params = new URLSearchParams(window.location.search);
const roomParam = params.get('room');

let state = {
  view: roomParam ? 'loading' : 'home',
  roomCode: roomParam || null,
  room: null,
  entries: [],
  unlocked: false,
  pinEntryOpen: false,
  pinEntry: ['', '', '', ''],
  pinError: false,
  name: '',
  problem: '',
  justJoined: false,
  accentColor: getCookie('hq_accent_color') || DEFAULT_ACCENT,
};
applyAccent(state.accentColor);

function isExpired(room) {
  return !!(room && room.expiresAt && room.expiresAt.toDate && room.expiresAt.toDate().getTime() <= Date.now());
}

// Rebuilds the page HTML while preserving focus + cursor position on whatever
// input the person is currently typing in, so live Firestore updates (or the
// 5-second timer tick) don't interrupt someone mid-keystroke.
function render() {
  const active = document.activeElement;
  const focusInfo = (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') && active.id)
    ? { id: active.id, start: active.selectionStart, end: active.selectionEnd }
    : null;

  const root = document.getElementById('root');
  let statusLabel = 'Room open';
  if (state.room) {
    if (isExpired(state.room)) statusLabel = 'Room expired';
    else if (state.room.active === false) statusLabel = 'Room closed';
  }
  let html = '<div class="wrap"><div class="header"><div class="chip-logo"></div><div>';
  html += '<h1>Help Queue</h1><div class="sub">' + statusLabel + '</div>';
  html += '</div></div>';

  if (state.view === 'home') html += renderHome();
  else if (state.view === 'loading') html += '<div class="panel"><p class="lead">Loading room&hellip;</p></div>';
  else if (state.view === 'notfound') html += '<div class="panel"><div class="banner warn">This room code doesn\'t exist, or it has already been deleted. Double-check the link with your teacher.</div></div>';
  else if (state.view === 'room') html += renderRoom();

  html += '<div class="footer-note">Help Queue &middot; built for Ms. Herrick\'s classroom &middot; rooms auto-delete 24 hours after creation &middot; <a href="privacy.html">Privacy Policy</a></div></div>';
  root.innerHTML = html;
  wireEvents();

  if (focusInfo) {
    const el = document.getElementById(focusInfo.id);
    if (el) {
      el.focus();
      if (typeof focusInfo.start === 'number' && el.setSelectionRange) {
        try { el.setSelectionRange(focusInfo.start, focusInfo.end); } catch (e) { /* not all input types support this */ }
      }
    }
  }
}

function renderHome() {
  let html = '<div class="panel">';
  html += '<p class="lead">Create a new help queue room. You\'ll land straight in the teacher view with your room code, PIN, shareable link, and live queue all in one place. Every room deletes itself automatically 24 hours after it\'s created.</p>';
  html += '<button class="btn-primary" id="createBtn">Create New Room</button>';
  html += '</div>';
  return html;
}

function renderRoom() {
  const room = state.room;
  const expired = isExpired(room);
  const isActive = room.active !== false && !expired;
  let html = '';

  html += '<div class="panel">';
  html += '<div class="board-head">';
  html += '<div class="board-count">ROOM ' + state.roomCode + '</div>';
  html += '<span class="status-pill ' + (expired ? 'expired' : (isActive ? 'active' : 'closed')) + '">' + (expired ? 'Expired' : (isActive ? 'Open' : 'Closed')) + '</span>';
  html += '</div>';

  if (!expired && room.expiresAt && room.expiresAt.toDate) {
    html += '<div class="ticket-meta" style="margin-bottom:16px;">' + hoursMinsLeft(room.expiresAt.toDate()) + ' until this room auto-deletes</div>';
  }

  if (state.unlocked) {
    // Teacher view: identity + share info always visible, plus management controls.
    html += '<div class="code-display">';
    html += '<div class="code-box"><div class="label">Room Code</div><div class="value">' + state.roomCode + '</div></div>';
    html += '<div class="code-box"><div class="label">Manage PIN</div><div class="value">' + room.pin + '</div></div>';
    html += '</div>';
    html += '<label>Student link</label>';
    html += '<div class="link-row"><input type="text" id="linkField" readonly value="' + esc(roomLink(state.roomCode)) + '">';
    html += '<button class="btn-outline" id="copyLinkBtn">Copy</button></div>';
    html += '<label>Accent Color <span class="accent-hint">(everyone viewing this room sees it too, and it becomes your default for new rooms)</span></label>';
    html += '<div class="accent-row">';
    html += '<input type="color" id="accentColorPicker" value="' + (HEX_RE.test(state.accentColor) && state.accentColor.length === 7 ? state.accentColor : DEFAULT_ACCENT) + '">';
    html += '<input type="text" id="accentHexInput" class="mono" maxlength="7" value="' + esc(state.accentColor) + '" placeholder="#7ad4ef">';
    html += '</div>';
    html += '<hr class="divider">';
    html += '<div class="btn-row">';
    if (isActive) html += '<button class="btn-danger" id="endRoomBtn">End Room</button>';
    else if (!expired) html += '<button class="btn-green" id="reopenRoomBtn">Reopen Room</button>';
    html += '<button class="btn-outline" id="exportBtn">Download CSV</button>';
    html += '<button class="btn-danger" id="deleteRoomBtn">Delete Room Permanently</button>';
    html += '</div>';
  } else {
    if (isActive) {
      if (state.justJoined) {
        html += '<div class="banner info">You\'re in the queue. Your teacher will call you when it\'s your turn. Feel free to close this tab.</div>';
      } else {
        html += '<label>Your name</label>';
        html += '<input type="text" id="nameInput" placeholder="First name + last initial" value="' + esc(state.name) + '">';
        html += '<label>What do you need help with?</label>';
        html += '<textarea id="problemInput" placeholder="Briefly describe the problem">' + esc(state.problem) + '</textarea>';
        html += '<button class="btn-primary" id="joinBtn"' + (state.name.trim() && state.problem.trim() ? '' : ' disabled') + '>Request a spot</button>';
      }
    } else {
      html += '<div class="banner warn">' + (expired ? 'This room has expired.' : 'This room has been closed by your teacher.') + ' New requests aren\'t being accepted.</div>';
    }
    html += '<div class="manage-link" id="showPinBtn">Teacher? Manage this room</div>';
    if (state.pinEntryOpen) {
      html += '<div class="pin-inputs">';
      for (let i = 0; i < 4; i++) {
        html += '<input type="tel" maxlength="1" id="pinDigit' + i + '" class="pin-digit" data-idx="' + i + '" value="' + esc(state.pinEntry[i]) + '">';
      }
      html += '</div>';
      if (state.pinError) html += '<div class="banner warn" style="margin-top:12px;">Incorrect PIN.</div>';
    }
  }
  html += '</div>';

  // Live queue
  const activeEntries = state.entries.filter(e => !e.helpedAt).sort((a, b) => a.order - b.order);
  html += '<div class="panel">';
  html += '<div class="board-head"><div class="board-count">LIVE QUEUE</div><div class="board-count">' + activeEntries.length + ' WAITING</div></div>';
  if (activeEntries.length === 0) {
    html += '<div class="empty-state">Queue is empty right now.</div>';
  } else {
    activeEntries.forEach((e, i) => {
      html += '<div class="ticket' + (i === 0 ? ' next' : '') + '">';
      html += '<div class="pin-badge">' + (i + 1) + '</div>';
      html += '<div class="ticket-body">';
      html += '<div class="ticket-name">' + esc(e.name) + '</div>';
      html += '<div class="ticket-meta">' + (e.timestampDate ? timeAgo(e.timestampDate) : 'just now') + '</div>';
      html += '<div class="note-text">' + esc(e.problem) + '</div>';
      html += '</div>';
      if (state.unlocked) {
        html += '<div class="ticket-actions">';
        html += '<div class="reorder-btns">';
        html += '<button class="icon-btn" data-move="up" data-id="' + e.id + '"' + (i === 0 ? ' disabled' : '') + '>&#9650;</button>';
        html += '<button class="icon-btn" data-move="down" data-id="' + e.id + '"' + (i === activeEntries.length - 1 ? ' disabled' : '') + '>&#9660;</button>';
        html += '</div>';
        html += '<button class="btn-danger small" data-remove="' + e.id + '">Remove</button>';
        html += '<button class="helped-btn" data-id="' + e.id + '">Helped</button>';
        html += '</div>';
      }
      html += '</div>';
    });
  }
  html += '</div>';

  // Already Helped (teacher view only)
  if (state.unlocked) {
    const helpedEntries = state.entries
      .filter(e => e.helpedAt)
      .sort((a, b) => (b.helpedAtDate ? b.helpedAtDate.getTime() : 0) - (a.helpedAtDate ? a.helpedAtDate.getTime() : 0));
    html += '<div class="panel">';
    html += '<div class="board-head"><div class="board-count">ALREADY HELPED</div><div class="board-count">' + helpedEntries.length + '</div></div>';
    if (helpedEntries.length === 0) {
      html += '<div class="empty-state" style="padding:24px;">No one\'s been marked helped yet.</div>';
    } else {
      helpedEntries.forEach(e => {
        html += '<div class="ticket helped">';
        html += '<div class="ticket-body">';
        html += '<div class="ticket-name">' + esc(e.name) + '</div>';
        html += '<div class="ticket-meta">helped ' + (e.helpedAtDate ? e.helpedAtDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '') + '</div>';
        html += '<div class="note-text">' + esc(e.problem) + '</div>';
        html += '</div></div>';
      });
    }
    html += '</div>';
  }

  return html;
}

function timeAgo(date) {
  const secs = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
  if (secs < 60) return 'waiting ' + secs + 's';
  const m = Math.floor(secs / 60);
  return 'waiting ' + m + 'm ' + (secs % 60) + 's';
}

function wireEvents() {
  const createBtn = document.getElementById('createBtn');
  if (createBtn) createBtn.onclick = handleCreateRoom;

  const copyLinkBtn = document.getElementById('copyLinkBtn');
  if (copyLinkBtn) copyLinkBtn.onclick = () => {
    const field = document.getElementById('linkField');
    field.select();
    navigator.clipboard && navigator.clipboard.writeText(field.value);
    copyLinkBtn.textContent = 'Copied';
    setTimeout(() => { copyLinkBtn.textContent = 'Copy'; }, 1500);
  };

  const nameInput = document.getElementById('nameInput');
  if (nameInput) nameInput.oninput = e => { state.name = e.target.value; updateJoinBtn(); };
  const problemInput = document.getElementById('problemInput');
  if (problemInput) problemInput.oninput = e => { state.problem = e.target.value; updateJoinBtn(); };

  const joinBtn = document.getElementById('joinBtn');
  if (joinBtn) joinBtn.onclick = handleJoin;

  const showPinBtn = document.getElementById('showPinBtn');
  if (showPinBtn) showPinBtn.onclick = () => {
    state.pinEntryOpen = !state.pinEntryOpen;
    state.pinError = false;
    render();
    const first = document.getElementById('pinDigit0');
    if (first) first.focus();
  };

  document.querySelectorAll('.pin-digit').forEach(inp => {
    inp.oninput = e => {
      const idx = parseInt(e.target.getAttribute('data-idx'), 10);
      const val = e.target.value.replace(/\D/g, '').slice(0, 1);
      state.pinEntry[idx] = val;
      e.target.value = val;
      if (val && idx < 3) {
        const next = document.getElementById('pinDigit' + (idx + 1));
        if (next) next.focus();
      }
      if (state.pinEntry.every(d => d !== '')) checkPin();
    };
    inp.onkeydown = e => {
      const idx = parseInt(e.target.getAttribute('data-idx'), 10);
      if (e.key === 'Backspace' && !e.target.value && idx > 0) {
        const prev = document.getElementById('pinDigit' + (idx - 1));
        if (prev) prev.focus();
      }
    };
  });

  const accentColorPicker = document.getElementById('accentColorPicker');
  if (accentColorPicker) accentColorPicker.oninput = e => commitAccent(e.target.value);

  const accentHexInput = document.getElementById('accentHexInput');
  if (accentHexInput) accentHexInput.oninput = e => {
    const raw = e.target.value.trim();
    const normalized = raw.startsWith('#') ? raw : '#' + raw;
    if (HEX_RE.test(normalized) && normalized.length === 7) {
      commitAccent(normalized);
    } else {
      state.accentColor = raw; // let them keep typing before it's valid, without losing what they typed
      render();
    }
  };

  const endRoomBtn = document.getElementById('endRoomBtn');
  if (endRoomBtn) endRoomBtn.onclick = () => {
    if (confirm('End this room? Students will no longer be able to request help.')) {
      db.collection('rooms').doc(state.roomCode).update({ active: false });
    }
  };
  const reopenRoomBtn = document.getElementById('reopenRoomBtn');
  if (reopenRoomBtn) reopenRoomBtn.onclick = () => {
    db.collection('rooms').doc(state.roomCode).update({ active: true });
  };
  const deleteRoomBtn = document.getElementById('deleteRoomBtn');
  if (deleteRoomBtn) deleteRoomBtn.onclick = handleDeleteRoom;

  const exportBtn = document.getElementById('exportBtn');
  if (exportBtn) exportBtn.onclick = handleExportCSV;

  document.querySelectorAll('.helped-btn').forEach(btn => {
    btn.onclick = () => {
      db.collection('rooms').doc(state.roomCode).collection('entries').doc(btn.getAttribute('data-id'))
        .update({ helpedAt: firebase.firestore.FieldValue.serverTimestamp() });
    };
  });

  document.querySelectorAll('[data-remove]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-remove');
      db.collection('rooms').doc(state.roomCode).collection('entries').doc(id).delete();
    };
  });

  document.querySelectorAll('[data-move]').forEach(btn => {
    btn.onclick = () => moveEntry(btn.getAttribute('data-id'), btn.getAttribute('data-move'));
  });
}

function updateJoinBtn() {
  const joinBtn = document.getElementById('joinBtn');
  if (joinBtn) joinBtn.disabled = !(state.name.trim() && state.problem.trim());
}

async function handleCreateRoom() {
  const code = generateRoomCode();
  const pin = generatePin();
  const expiresAt = firebase.firestore.Timestamp.fromDate(new Date(Date.now() + ROOM_TTL_MS));
  await db.collection('rooms').doc(code).set({
    pin,
    active: true,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    expiresAt,
    accentColor: getCookie('hq_accent_color') || DEFAULT_ACCENT
  });
  // Unlock this tab for the new room before navigating, so creating a room
  // drops you straight into the full teacher view - code, PIN, link, queue, CSV.
  sessionStorage.setItem('unlocked_' + code, '1');
  window.location.search = '?room=' + code;
}

async function handleJoin() {
  if (!state.name.trim() || !state.problem.trim()) return;
  await db.collection('rooms').doc(state.roomCode).collection('entries').add({
    name: state.name.trim(),
    problem: state.problem.trim(),
    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    order: Date.now(),
    helpedAt: null,
    expiresAt: state.room.expiresAt
  });
  state.justJoined = true;
  render();
}

function commitAccent(hex) {
  state.accentColor = hex;
  applyAccent(hex);
  setCookie('hq_accent_color', hex, 365);
  if (state.roomCode) {
    db.collection('rooms').doc(state.roomCode).update({ accentColor: hex }).catch(() => {});
  }
  render();
}

function checkPin() {
  const entered = state.pinEntry.join('');
  if (entered === state.room.pin) {
    state.unlocked = true;
    state.pinEntryOpen = false;
    state.pinError = false;
    sessionStorage.setItem('unlocked_' + state.roomCode, '1');
  } else {
    state.pinError = true;
    state.pinEntry = ['', '', '', ''];
  }
  render();
}

async function moveEntry(entryId, direction) {
  const activeList = state.entries.filter(e => !e.helpedAt).sort((a, b) => a.order - b.order);
  const idx = activeList.findIndex(e => e.id === entryId);
  const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
  if (idx === -1 || swapIdx < 0 || swapIdx >= activeList.length) return;
  const a = activeList[idx], b = activeList[swapIdx];
  const batch = db.batch();
  const col = db.collection('rooms').doc(state.roomCode).collection('entries');
  batch.update(col.doc(a.id), { order: b.order });
  batch.update(col.doc(b.id), { order: a.order });
  await batch.commit();
}

async function handleExportCSV() {
  const snap = await db.collection('rooms').doc(state.roomCode).collection('entries').orderBy('timestamp').get();
  const rows = [['Timestamp', 'Name', 'Problem', 'Helped At']];
  snap.forEach(doc => {
    const d = doc.data();
    const ts = d.timestamp && d.timestamp.toDate ? d.timestamp.toDate().toLocaleString() : '';
    const helped = d.helpedAt && d.helpedAt.toDate ? d.helpedAt.toDate().toLocaleString() : '';
    rows.push([ts, d.name, d.problem, helped]);
  });
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  downloadFile(csv, 'help-queue-' + state.roomCode + '-' + new Date().toISOString().slice(0, 10) + '.csv', 'text/csv');
}

async function handleDeleteRoom() {
  if (!confirm('Permanently delete this room and everything in it? This cannot be undone. Download the CSV first if you want a record.')) return;
  const entriesSnap = await db.collection('rooms').doc(state.roomCode).collection('entries').get();
  const batch = db.batch();
  entriesSnap.forEach(doc => batch.delete(doc.ref));
  batch.delete(db.collection('rooms').doc(state.roomCode));
  await batch.commit();
  window.location.href = window.location.pathname;
}

function attachRoomListeners() {
  db.collection('rooms').doc(state.roomCode).onSnapshot(doc => {
    if (!doc.exists) {
      state.view = 'notfound';
      render();
      return;
    }
    state.room = doc.data();
    if (state.view === 'loading') state.view = 'room';
    if (sessionStorage.getItem('unlocked_' + state.roomCode) === '1') state.unlocked = true;
    if (state.room.accentColor && HEX_RE.test(state.room.accentColor)) {
      state.accentColor = state.room.accentColor;
      applyAccent(state.accentColor);
    }
    render();
  });

  db.collection('rooms').doc(state.roomCode).collection('entries')
    .orderBy('timestamp', 'asc')
    .onSnapshot(snap => {
      state.entries = snap.docs.map(d => {
        const data = d.data();
        return {
          id: d.id,
          name: data.name,
          problem: data.problem,
          helpedAt: data.helpedAt,
          helpedAtDate: data.helpedAt && data.helpedAt.toDate ? data.helpedAt.toDate() : null,
          order: typeof data.order === 'number' ? data.order : (data.timestamp && data.timestamp.toMillis ? data.timestamp.toMillis() : 0),
          timestampDate: data.timestamp && data.timestamp.toDate ? data.timestamp.toDate() : null
        };
      });
      render();
    });
}

if (state.roomCode) {
  attachRoomListeners();
} else {
  render();
}

// Live-updating timers and expiry checks without refetching from Firestore
setInterval(() => { if (state.view === 'room') render(); }, 5000);
</script>
</body>
</html>
