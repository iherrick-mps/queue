<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Queue</title>
<style>
  :root {
    --bg: #12181f;
    --panel: #1b2430;
    --panel-2: #212c3a;
    --grid: #2a3541;
    --text: #e8edf2;
    --text-muted: #8a97a6;
    --blue: #5ec8e0;
    --amber: #ffb627;
    --green: #3ecf8e;
    --red: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .mono { font-family: 'Courier New', monospace; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .chip-logo { width: 34px; height: 34px; border: 2px solid var(--blue); border-radius: 6px; position: relative; flex-shrink: 0; }
  .chip-logo::before, .chip-logo::after { content: ''; position: absolute; background: var(--blue); width: 10px; height: 2px; top: 8px; }
  .chip-logo::before { left: -6px; box-shadow: 0 16px 0 var(--blue); }
  .chip-logo::after { right: -6px; box-shadow: 0 16px 0 var(--blue); }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--text-muted); font-size: 12.5px; margin-top: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--grid); border-radius: 14px; padding: 22px; margin-bottom: 16px; }
  p.lead { color: var(--text-muted); font-size: 14px; line-height: 1.5; }
  label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; margin-top: 16px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=tel] {
    width: 100%; background: var(--panel-2); border: 1px solid var(--grid); color: var(--text);
    padding: 12px 14px; border-radius: 8px; font-size: 15px;
  }
  input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
  textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--grid); color: var(--text);
    padding: 12px 14px; border-radius: 8px; font-size: 15px; resize: vertical; min-height: 70px;
    font-family: inherit;
  }
  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 9px; font-weight: 700; font-size: 14.5px;
  }
  .btn-primary { width: 100%; margin-top: 20px; padding: 14px; background: var(--blue); color: #0d1620; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-outline { padding: 10px 16px; background: transparent; border: 1.5px solid var(--grid); color: var(--text); }
  .btn-outline:hover { border-color: var(--blue); color: var(--blue); }
  .btn-danger { padding: 10px 16px; background: transparent; border: 1.5px solid var(--red); color: var(--red); }
  .btn-green { padding: 10px 16px; background: var(--green); color: #0d1620; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .code-display {
    display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px;
  }
  .code-box {
    flex: 1; min-width: 130px; background: var(--panel-2); border: 1px solid var(--grid); border-radius: 10px;
    padding: 14px; text-align: center;
  }
  .code-box .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .code-box .value { font-family: 'Courier New', monospace; font-size: 26px; font-weight: 700; color: var(--blue); margin-top: 4px; letter-spacing: 0.05em; }
  .link-row { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .link-row input { flex: 1; }
  .status-pill { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .status-pill.active { background: rgba(62,207,142,0.15); color: var(--green); }
  .status-pill.closed { background: rgba(255,107,107,0.15); color: var(--red); }
  .board-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .board-count { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-muted); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .ticket { display: flex; align-items: flex-start; gap: 14px; background: var(--panel-2); border: 1px solid var(--grid); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .ticket.next { border-color: var(--amber); box-shadow: 0 0 0 1px rgba(255,182,39,0.25); }
  .pin-badge { width: 34px; height: 34px; border-radius: 7px; border: 1.5px solid var(--grid); display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; font-weight: 700; font-size: 13px; flex-shrink: 0; color: var(--text-muted); }
  .ticket.next .pin-badge { border-color: var(--amber); color: var(--amber); }
  .ticket-body { flex: 1; min-width: 0; }
  .ticket-name { font-weight: 700; font-size: 14.5px; }
  .ticket-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; font-family: 'Courier New', monospace; }
  .note-text { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .helped-btn { background: var(--green); color: #0d1620; border: none; padding: 8px 12px; border-radius: 7px; font-weight: 700; font-size: 12px; flex-shrink: 0; cursor: pointer; }
  .banner { padding: 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 16px; }
  .banner.info { background: rgba(94,200,224,0.08); border: 1px solid rgba(94,200,224,0.35); color: var(--blue); }
  .banner.warn { background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.35); color: var(--red); }
  .manage-link { display: inline-block; margin-top: 6px; color: var(--text-muted); font-size: 12.5px; cursor: pointer; text-decoration: underline; }
  .footer-note { text-align: center; color: var(--text-muted); font-size: 11.5px; margin-top: 20px; }
  .pin-inputs { display: flex; gap: 8px; margin-top: 8px; }
  .pin-inputs input { text-align: center; font-size: 20px; font-family: 'Courier New', monospace; padding: 12px; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Firebase SDKs (static hosting compatible, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const ROOM_CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no 0/O or 1/I to avoid confusion
function generateRoomCode(len = 5) {
  let code = '';
  for (let i = 0; i < len; i++) code += ROOM_CODE_CHARS[Math.floor(Math.random() * ROOM_CODE_CHARS.length)];
  return code;
}
function generatePin() {
  return String(Math.floor(1000 + Math.random() * 9000));
}
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}
function csvEscape(val) {
  const s = String(val == null ? '' : val);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function roomLink(code) {
  const url = new URL(window.location.href);
  url.search = '?room=' + code;
  url.hash = '';
  return url.toString();
}

const params = new URLSearchParams(window.location.search);
const roomParam = params.get('room');

let state = {
  view: roomParam ? 'loading' : 'home',
  roomCode: roomParam || null,
  room: null,
  entries: [],
  unlocked: false,
  createdInfo: null,
  pinEntry: ['', '', '', ''],
  pinError: false,
  name: '',
  problem: '',
  justJoined: false,
};

let unsubEntries = null;
let unsubRoom = null;

function render() {
  const root = document.getElementById('root');
  let html = '<div class="wrap"><div class="header"><div class="chip-logo"></div><div>';
  html += '<h1>Help Queue</h1><div class="sub mono">' + (state.room && state.room.active === false ? 'Room closed' : 'Room open') + '</div>';
  html += '</div></div>';

  if (state.view === 'home') html += renderHome();
  else if (state.view === 'created') html += renderCreated();
  else if (state.view === 'loading') html += '<div class="panel"><p class="lead">Loading room&hellip;</p></div>';
  else if (state.view === 'notfound') html += '<div class="panel"><div class="banner warn">This room code doesn\'t exist. Double-check the link with your teacher.</div></div>';
  else if (state.view === 'room') html += renderRoom();

  html += '<div class="footer-note">Help Queue &middot; built for Ms. Herrick\'s classroom</div></div>';
  root.innerHTML = html;
  wireEvents();
}

function renderHome() {
  let html = '<div class="panel">';
  html += '<p class="lead">Create a new help queue room. You\'ll get a shareable link for students and a 4-digit PIN to manage the room.</p>';
  html += '<button class="btn-primary" id="createBtn">Create New Room</button>';
  html += '</div>';
  return html;
}

function renderCreated() {
  const info = state.createdInfo;
  let html = '<div class="panel">';
  html += '<div class="banner info">Room created. Save your PIN &mdash; you\'ll need it to manage this room, even if you reopen this page later.</div>';
  html += '<div class="code-display">';
  html += '<div class="code-box"><div class="label">Room Code</div><div class="value">' + info.code + '</div></div>';
  html += '<div class="code-box"><div class="label">Manage PIN</div><div class="value">' + info.pin + '</div></div>';
  html += '</div>';
  html += '<label>Student link (share this)</label>';
  html += '<div class="link-row"><input type="text" id="linkField" readonly value="' + esc(info.link) + '">';
  html += '<button class="btn-outline" id="copyLinkBtn">Copy</button></div>';
  html += '<div class="btn-row"><button class="btn-primary" id="goToRoomBtn" style="margin-top:0;flex:1;">Open This Room</button></div>';
  html += '</div>';
  return html;
}

function renderRoom() {
  const room = state.room;
  const isActive = room.active !== false;
  let html = '';

  html += '<div class="panel">';
  html += '<div class="board-head">';
  html += '<div class="board-count mono">ROOM ' + state.roomCode + '</div>';
  html += '<span class="status-pill ' + (isActive ? 'active' : 'closed') + '">' + (isActive ? 'Open' : 'Closed') + '</span>';
  html += '</div>';

  if (!state.unlocked) {
    if (isActive) {
      if (state.justJoined) {
        html += '<div class="banner info">You\'re in the queue. Your teacher will call you when it\'s your turn. Feel free to close this tab.</div>';
      } else {
        html += '<label>Your name</label>';
        html += '<input type="text" id="nameInput" placeholder="First name + last initial" value="' + esc(state.name) + '">';
        html += '<label>What do you need help with?</label>';
        html += '<textarea id="problemInput" placeholder="Briefly describe the problem">' + esc(state.problem) + '</textarea>';
        html += '<button class="btn-primary" id="joinBtn"' + (state.name.trim() && state.problem.trim() ? '' : ' disabled') + '>Request a spot</button>';
      }
    } else {
      html += '<div class="banner warn">This room has been closed by your teacher. New requests aren\'t being accepted.</div>';
    }
    html += '<div class="manage-link" id="showPinBtn">Teacher? Manage this room</div>';
    if (state.pinEntryOpen) {
      html += '<div class="pin-inputs">';
      for (let i = 0; i < 4; i++) {
        html += '<input type="tel" maxlength="1" class="pin-digit" data-idx="' + i + '" value="' + esc(state.pinEntry[i]) + '">';
      }
      html += '</div>';
      if (state.pinError) html += '<div class="banner warn" style="margin-top:10px;">Incorrect PIN.</div>';
    }
  } else {
    html += '<div class="btn-row">';
    if (isActive) html += '<button class="btn-danger" id="endRoomBtn">End Room</button>';
    else html += '<button class="btn-green" id="reopenRoomBtn">Reopen Room</button>';
    html += '<button class="btn-outline" id="exportBtn">Download CSV</button>';
    html += '</div>';
  }
  html += '</div>';

  // Live queue (visible to everyone)
  const activeEntries = state.entries.filter(e => !e.helpedAt);
  html += '<div class="panel">';
  html += '<div class="board-head"><div class="board-count mono">LIVE QUEUE</div><div class="board-count mono">' + activeEntries.length + ' WAITING</div></div>';
  if (activeEntries.length === 0) {
    html += '<div class="empty-state">Queue is empty right now.</div>';
  } else {
    activeEntries.forEach((e, i) => {
      html += '<div class="ticket' + (i === 0 ? ' next' : '') + '">';
      html += '<div class="pin-badge mono">' + (i + 1) + '</div>';
      html += '<div class="ticket-body">';
      html += '<div class="ticket-name">' + esc(e.name) + '</div>';
      html += '<div class="ticket-meta">' + (e.timestampDate ? timeAgo(e.timestampDate) : 'just now') + '</div>';
      html += '<div class="note-text">' + esc(e.problem) + '</div>';
      html += '</div>';
      if (state.unlocked) html += '<button class="helped-btn" data-id="' + e.id + '">Helped</button>';
      html += '</div>';
    });
  }
  html += '</div>';

  return html;
}

function timeAgo(date) {
  const secs = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
  if (secs < 60) return 'waiting ' + secs + 's';
  const m = Math.floor(secs / 60);
  return 'waiting ' + m + 'm ' + (secs % 60) + 's';
}

function wireEvents() {
  const createBtn = document.getElementById('createBtn');
  if (createBtn) createBtn.onclick = handleCreateRoom;

  const copyLinkBtn = document.getElementById('copyLinkBtn');
  if (copyLinkBtn) copyLinkBtn.onclick = () => {
    const field = document.getElementById('linkField');
    field.select();
    navigator.clipboard && navigator.clipboard.writeText(field.value);
    copyLinkBtn.textContent = 'Copied';
    setTimeout(() => { copyLinkBtn.textContent = 'Copy'; }, 1500);
  };

  const goToRoomBtn = document.getElementById('goToRoomBtn');
  if (goToRoomBtn) goToRoomBtn.onclick = () => {
    window.location.search = '?room=' + state.createdInfo.code;
  };

  const nameInput = document.getElementById('nameInput');
  if (nameInput) nameInput.oninput = e => { state.name = e.target.value; updateJoinBtn(); };
  const problemInput = document.getElementById('problemInput');
  if (problemInput) problemInput.oninput = e => { state.problem = e.target.value; updateJoinBtn(); };

  const joinBtn = document.getElementById('joinBtn');
  if (joinBtn) joinBtn.onclick = handleJoin;

  const showPinBtn = document.getElementById('showPinBtn');
  if (showPinBtn) showPinBtn.onclick = () => {
    state.pinEntryOpen = !state.pinEntryOpen;
    state.pinError = false;
    render();
    const first = document.querySelector('.pin-digit[data-idx="0"]');
    if (first) first.focus();
  };

  document.querySelectorAll('.pin-digit').forEach(inp => {
    inp.oninput = e => {
      const idx = parseInt(e.target.getAttribute('data-idx'), 10);
      const val = e.target.value.replace(/\D/g, '').slice(0, 1);
      state.pinEntry[idx] = val;
      e.target.value = val;
      if (val && idx < 3) {
        const next = document.querySelector('.pin-digit[data-idx="' + (idx + 1) + '"]');
        if (next) next.focus();
      }
      if (state.pinEntry.every(d => d !== '')) checkPin();
    };
    inp.onkeydown = e => {
      const idx = parseInt(e.target.getAttribute('data-idx'), 10);
      if (e.key === 'Backspace' && !e.target.value && idx > 0) {
        const prev = document.querySelector('.pin-digit[data-idx="' + (idx - 1) + '"]');
        if (prev) prev.focus();
      }
    };
  });

  const endRoomBtn = document.getElementById('endRoomBtn');
  if (endRoomBtn) endRoomBtn.onclick = () => {
    if (confirm('End this room? Students will no longer be able to request help.')) {
      db.collection('rooms').doc(state.roomCode).update({ active: false });
    }
  };
  const reopenRoomBtn = document.getElementById('reopenRoomBtn');
  if (reopenRoomBtn) reopenRoomBtn.onclick = () => {
    db.collection('rooms').doc(state.roomCode).update({ active: true });
  };

  const exportBtn = document.getElementById('exportBtn');
  if (exportBtn) exportBtn.onclick = handleExportCSV;

  document.querySelectorAll('.helped-btn').forEach(btn => {
    btn.onclick = () => {
      db.collection('rooms').doc(state.roomCode).collection('entries').doc(btn.getAttribute('data-id'))
        .update({ helpedAt: firebase.firestore.FieldValue.serverTimestamp() });
    };
  });
}

function updateJoinBtn() {
  const joinBtn = document.getElementById('joinBtn');
  if (joinBtn) joinBtn.disabled = !(state.name.trim() && state.problem.trim());
}

async function handleCreateRoom() {
  const code = generateRoomCode();
  const pin = generatePin();
  await db.collection('rooms').doc(code).set({
    pin,
    active: true,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  state.createdInfo = { code, pin, link: roomLink(code) };
  state.view = 'created';
  render();
}

async function handleJoin() {
  if (!state.name.trim() || !state.problem.trim()) return;
  await db.collection('rooms').doc(state.roomCode).collection('entries').add({
    name: state.name.trim(),
    problem: state.problem.trim(),
    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    helpedAt: null
  });
  state.justJoined = true;
  render();
}

function checkPin() {
  const entered = state.pinEntry.join('');
  if (entered === state.room.pin) {
    state.unlocked = true;
    state.pinEntryOpen = false;
    state.pinError = false;
    sessionStorage.setItem('unlocked_' + state.roomCode, '1');
  } else {
    state.pinError = true;
    state.pinEntry = ['', '', '', ''];
  }
  render();
}

async function handleExportCSV() {
  const snap = await db.collection('rooms').doc(state.roomCode).collection('entries').orderBy('timestamp').get();
  const rows = [['Timestamp', 'Name', 'Problem', 'Helped At']];
  snap.forEach(doc => {
    const d = doc.data();
    const ts = d.timestamp && d.timestamp.toDate ? d.timestamp.toDate().toLocaleString() : '';
    const helped = d.helpedAt && d.helpedAt.toDate ? d.helpedAt.toDate().toLocaleString() : '';
    rows.push([ts, d.name, d.problem, helped]);
  });
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  downloadFile(csv, 'help-queue-' + state.roomCode + '-' + new Date().toISOString().slice(0, 10) + '.csv', 'text/csv');
}

function attachRoomListeners() {
  unsubRoom = db.collection('rooms').doc(state.roomCode).onSnapshot(doc => {
    if (!doc.exists) {
      state.view = 'notfound';
      render();
      return;
    }
    state.room = doc.data();
    if (state.view === 'loading') state.view = 'room';
    if (sessionStorage.getItem('unlocked_' + state.roomCode) === '1') state.unlocked = true;
    render();
  });

  unsubEntries = db.collection('rooms').doc(state.roomCode).collection('entries')
    .orderBy('timestamp', 'asc')
    .onSnapshot(snap => {
      state.entries = snap.docs.map(d => {
        const data = d.data();
        return {
          id: d.id,
          name: data.name,
          problem: data.problem,
          helpedAt: data.helpedAt,
          timestampDate: data.timestamp && data.timestamp.toDate ? data.timestamp.toDate() : null
        };
      });
      render();
    });
}

if (state.roomCode) {
  attachRoomListeners();
} else {
  render();
}

// Live-updating "waiting Xs" timers without refetching from Firestore
setInterval(() => { if (state.view === 'room') render(); }, 5000);
</script>
</body>
</html>
