<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy — Help Queue</title>
<style>
  :root {
    --bg: #000000;
    --panel: #0a0a0a;
    --border: #3d3d3d;
    --text: #ffffff;
    --text-muted: #cfcfcf;
    --accent: #7ad4ef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 22px;
    font-size: 16px;
    line-height: 1.6;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  .back-link { display: inline-block; color: var(--text-muted); text-decoration: underline; font-size: 14px; margin-bottom: 18px; font-weight: 600; }
  .panel { background: var(--panel); border: 1.5px solid var(--border); border-radius: 14px; padding: 28px; }
  .panel h1 { font-size: 26px; margin: 0 0 14px 0; }
  .panel h2 { font-size: 17px; margin: 26px 0 8px 0; color: var(--text); }
  .panel h2:first-of-type { margin-top: 0; }
  .panel p, .panel li { color: var(--text-muted); font-size: 15.5px; }
  .panel strong { color: var(--text); }
  .panel em { color: var(--text-muted); font-style: italic; }
  .panel ul { padding-left: 20px; }
  .panel a { color: var(--accent); }
  .loading { color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="javascript:history.back()">&larr; Back</a>
  <div class="panel" id="content"><p class="loading">Loading privacy policy&hellip;</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  // Renders PRIVACY.md directly, so that file is the one and only source of truth
  // for this page's content - no duplicated copy to keep in sync.
  fetch('PRIVACY.md')
    .then(res => {
      if (!res.ok) throw new Error('not found');
      return res.text();
    })
    .then(markdown => {
      document.getElementById('content').innerHTML = marked.parse(markdown);
    })
    .catch(() => {
      document.getElementById('content').innerHTML =
        '<p>Could not load the privacy policy. Make sure <strong>PRIVACY.md</strong> is uploaded to this same repository, alongside index.html.</p>';
    });
</script>
</body>
</html>
